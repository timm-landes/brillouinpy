stages:
  - lint
  - test
  - docs

default:
  image: python:3.12
  before_script:
    - pip install .

lint:
  stage: lint
  before_script:
    - pip install ruff
  script:
    - ruff check .

test:
  stage: test
  before_script:
    - !reference [default, before_script]
    - pip install pytest
  script:
    - pytest tests/ -v

pages:
  stage: docs
  before_script:
    - !reference [default, before_script]
    - pip install -r docs/requirements.txt
  script:
    - sphinx-build -b html docs public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
