name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install .
      - run: pip install pytest
      # brimfile / HDF5_BLS only publish wheels for Python >= 3.11; on 3.10 the
      # brim / HDF5_BLS tests skip themselves via pytest.importorskip. Kept
      # non-fatal so a transient packaging issue in a third-party lib doesn't
      # turn CI red - the tests then just skip.
      - name: Install optional export backends
        if: matrix.python-version != '3.10'
        continue-on-error: true
        run: pip install brimfile HDF5_BLS
      - run: pytest tests/ -v
